# Dependency updates, opened as pull requests rather than applied.
#
# github-actions is listed first and matters most here: every action is pinned
# to a commit SHA, which is what stops a tag being repointed under us, and a SHA
# pin that nobody ever moves is a dependency frozen at whatever it was the day
# it was pinned. Dependabot is what keeps the pin current, so the two go
# together and neither works alone.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # No prefix with a colon: the repository writes commit subjects as
      # sentences, and "chore(deps):" is not one.
      prefix: Update
    groups:
      # codeql-action has to move as ONE pull request. Both `init` and
      # `analyze` come from that repository and CodeQL refuses to run when they
      # disagree:
      #
      #   Loaded a configuration file for version '4.39.1', but running version
      #   '4.39.0'. All steps in a workflow that use `github/codeql-action`
      #   must use the same version to work correctly.
      #
      # Ungrouped, Dependabot opens one pull request per `uses:` line, so each
      # one bumps half the pair and fails on its own - which is what #181 and
      # #185 were. Both looked like a broken CodeQL rather than a split update.
      # Every future CodeQL release would have done the same thing.
      codeql-action:
        patterns: ["github/codeql-action*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: Update
    # Grouped, because fifteen separate pull requests for one week of patch
    # releases is a queue nobody reads, and an unread queue is the same as no
    # updates at all.
    groups:
      python-dependencies:
        patterns: ["*"]
