name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. Scorecard's Token-Permissions check reads the
# TOP level: without one, every job gets whatever the repository default is,
# which for a workflow that only reads code is more than it needs. A job that
# genuinely needs to write declares it for itself, below.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      ECHO_MEMORY_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/echo_memory_test
      ECHO_MEMORY_USER_ID: ci
      ECHO_MEMORY_AGENT_ID: ci
      # Refuse a green run that silently skipped every integration test.
      ECHO_MEMORY_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built from source, not the apache/age image: see docker/postgres.Dockerfile
      # and the design doc's Foundational spike section for why. Cached across runs
      # so only the first build after a Dockerfile change pays the compile cost.
      - name: Build Postgres + pgvector + Apache AGE image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/postgres.Dockerfile
          tags: echo-mem-db:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start database
        run: |
          docker run -d --name echo-mem-db \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=echo_memory_test \
            -p 5433:5432 echo-mem-db:ci
          for i in $(seq 1 30); do
            docker exec echo-mem-db pg_isready -U postgres && break
            sleep 2
          done

      - name: Test (pytest, excluding LLM-quality evals)
        # --cov-fail-under is a ratchet, not a target. The floor is whatever
        # was measured when it was last raised, so the number can only go up
        # deliberately. It is NOT set to the current figure exactly: coverage
        # of a suite that talks to a real database moves by a line or two with
        # timing, and a gate that fails on noise gets removed rather than
        # fixed.
        #
        # The point of the number is not the number. 998 tests was quoted as
        # evidence in docs/COMPLIANCE.md and is evidence of effort rather than
        # of reach; the first real measurement found the three commands that
        # erase, verify and expire customer data sitting at 6.6%, 8.6% and
        # 9.8%, which is the layer where --confirm lives.
        run: pytest -m "not eval" --cov --cov-report=term --cov-fail-under=75
