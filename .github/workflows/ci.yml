name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. Scorecard's Token-Permissions check reads the
# TOP level: without one, every job gets whatever the repository default is,
# which for a workflow that only reads code is more than it needs. A job that
# genuinely needs to write declares it for itself, below.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      ECHO_MEMORY_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/echo_memory
      ECHO_MEMORY_USER_ID: ci
      ECHO_MEMORY_AGENT_ID: ci
      # Refuse a green run that silently skipped every integration test.
      ECHO_MEMORY_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built from source, not the apache/age image: see docker/postgres.Dockerfile
      # and the design doc's Foundational spike section for why. Cached across runs
      # so only the first build after a Dockerfile change pays the compile cost.
      - name: Build Postgres + pgvector + Apache AGE image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/postgres.Dockerfile
          tags: echo-mem-db:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start database
        run: |
          docker run -d --name echo-mem-db \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=echo_memory \
            -p 5433:5432 echo-mem-db:ci
          for i in $(seq 1 30); do
            docker exec echo-mem-db pg_isready -U postgres && break
            sleep 2
          done

      - name: Test (pytest, excluding LLM-quality evals)
        run: pytest -m "not eval"
