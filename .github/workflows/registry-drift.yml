# Says out loud when the MCP registry is serving an older release than PyPI.
#
# The registry is how somebody looking for an MCP memory server finds this one.
# On 2026-10-26 it was serving 0.5.3 while PyPI was on 0.5.5, and nothing
# anywhere said so: server.json was already correct, and the publish is a
# manual step that had simply not been run.
#
# Scheduled rather than on push, deliberately. The drift is not caused by a
# commit and cannot be fixed by one: publishing needs a personal GitHub login,
# because the namespace io.github.ayushcodes10/* belongs to an account rather
# than to this organisation, and an Actions token cannot claim it. A check on
# every pull request would therefore fail on work that has nothing to do with
# it, which is how a red tick stops meaning anything.
#
# A failing scheduled run emails the owner, which is the whole mechanism.
name: Registry drift

on:
  # On demand as well as on a schedule. A workflow that can only be triggered
  # by cron cannot be verified when it matters: after fixing the thing it
  # watches, the only way to know it now passes is to wait a day. That is the
  # same shape as release.yml running on tags alone, which is how the v0.5.6
  # publish shipped a job with no checkout in it.
  workflow_dispatch:
  schedule:
    # 06:00 UTC daily. Not on the hour, because every cron in the world runs
    # then and GitHub delays the queue.
    - cron: "7 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # No dependencies: the script is stdlib only, so this cannot start
      # failing because of an unrelated install problem and send somebody
      # looking at the registry when nothing is wrong with it.
      - name: The registry, PyPI and server.json must agree
        run: python scripts/check_registry_is_current.py
