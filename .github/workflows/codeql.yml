# Static analysis, on every push to main and every pull request.
#
# ruff runs in ci.yml and is a linter, not a security scanner: it will not find
# an injection or a path traversal, and OpenSSF Scorecard's SAST check scored 0
# while it was the only thing running. This is the one that looks for those.
#
# python-only, because that is what this repository is. The default query suite
# plus security-extended, so it reports the lower confidence findings too; this
# is a small codebase and the false positive cost is a few minutes of reading.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, because a query pack improves without the code changing and a
    # repository that only scans on commit stops being scanned the week nobody
    # commits.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      # The two this needs and nothing else. security-events is where findings
      # go; actions: read lets the scan see workflow files.
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: python
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:python"
