# Publish to PyPI when a version tag is pushed.
#
# This exists because there was no release path at all. echo-mem 0.1.0 went to
# PyPI by hand on 2026-08-25 and was never republished, so by 2026-09-07 the
# published package was 30 commits and five migrations behind main - including
# 0008 through 0011, which means a pip-installed user could not reach the
# current schema. Worse, pyproject still said 0.1.0, so one version string
# named two materially different codebases and nothing about the artifact
# revealed which one you had.
#
# Pushing to git does not publish. Only a v-prefixed tag does, and the tag has
# to match the version in pyproject.toml - checked below, because a tag that
# disagrees with the metadata reintroduces exactly the ambiguity above.
#
# Auth is PyPI Trusted Publishing (OIDC), so there is no API token in repository
# secrets to leak or rotate. It requires a one-time setup on PyPI: project
# settings, publishing, add a GitHub publisher for this repo with workflow
# `release.yml` and environment `pypi`.
#
# That setup names an OWNER, and moving the repository invalidates it silently.
# v0.4.0 failed here on 2026-09-19 with `invalid-publisher`: the publisher still
# named ayushcodes10 while the token said echo-mem, because the repositories
# moved to the organisation on 2026-09-16. Nothing warns about this, and the
# build job succeeds, so the failure looks like a publish step flake rather than
# a configuration that stopped being true. The Vercel deploy for the landing
# page broke the same way on the same day, which makes this the second one.
#
# The publisher PyPI needs now:
#   owner        echo-mem
#   repository   echo-mem
#   workflow     release.yml
#   environment  pypi
#
# Fixing it does not need a new tag. Re-run the failed workflow:
#   gh run rerun <run-id> --failed

name: Release

on:
  push:
    tags: ["v*"]

# Least privilege by default. Scorecard's Token-Permissions check reads the
# TOP level: without one, every job gets whatever the repository default is,
# which for a workflow that only reads code is more than it needs. A job that
# genuinely needs to write declares it for itself, below.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Refuse a tag that disagrees with pyproject
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, pyproject says $pkg" >&2
            exit 1
          fi
          echo "releasing $pkg"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      # The migrations are package data, and a pip install with no alembic.ini
      # depends on them being inside the wheel (see cli/initdb.py). A wheel
      # missing them installs cleanly and then cannot create its own schema,
      # which is the failure this whole file exists to stop shipping.
      - name: Check the wheel carries the migrations
        run: |
          python -m pip install --upgrade wheel
          wheel=$(ls dist/*.whl)
          # Counted from the source tree, not hardcoded: a literal here would
          # silently stop covering the newest migration the day one is added.
          want=$(ls src/echo_memory/migrations/versions/*.py | wc -l)
          found=$(unzip -l "$wheel" | grep -c 'migrations/versions/.*\.py' || true)
          echo "$found of $want migration scripts in $wheel"
          if [ "$found" -lt "$want" ]; then
            echo "wheel is missing migration scripts; a pip install could not run init-db" >&2
            unzip -l "$wheel" | grep migrations || true
            exit 1
          fi
          unzip -l "$wheel" | grep -q 'alembic.ini' \
            || echo "note: alembic.ini is intentionally absent; init-db drives Alembic through its Python API"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # Trusted Publishing; no password or token is used
      attestations: write   # the build provenance written below
      contents: write       # creating the GitHub Release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      # A real attestation over the files about to be published, signed through
      # Sigstore with this workflow's own identity. PyPI issues one of its own
      # on upload, which is the authoritative one for anybody installing with
      # pip; this is the same guarantee attached where a GitHub release is
      # audited, because an auditor looking at the Releases page should not have
      # to know that the evidence lives on PyPI.
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "dist/*"

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      # The release, with the distributions on it. Tags were pushed for every
      # version and no GitHub Release ever existed, so the Releases page was
      # empty while five versions were live on PyPI, and a scanner looking for
      # signed releases correctly reported finding none.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes "Published to PyPI as \`echo-mem ${GITHUB_REF_NAME#v}\`.

          Built and published by GitHub Actions through PyPI Trusted Publishing. The
          distributions attached here carry a Sigstore build attestation from this
          workflow, and PyPI holds its own for the same files:
          https://pypi.org/integrity/echo-mem/${GITHUB_REF_NAME#v}/echo_mem-${GITHUB_REF_NAME#v}-py3-none-any.whl/provenance

          What changed: [CHANGELOG.md](https://github.com/echo-mem/echo-mem/blob/main/CHANGELOG.md)"
