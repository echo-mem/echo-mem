# Publish the database image, so nobody has to compile Apache AGE to try this.
#
# The one hard prerequisite of self-hosting is a Postgres that has both
# pgvector and Apache AGE, and no managed provider offers AGE - not RDS,
# Aurora, Cloud SQL, Neon or Supabase. Until this workflow existed the only
# way to get one was `docker build` against docker/postgres.Dockerfile, which
# compiles AGE from source: minutes of build on a first run, and a wall for
# anyone evaluating the project who has never heard of AGE.
#
# Multi-arch on purpose. The Dockerfile's own comment records why: apache/age
# publishes amd64 only, and under QEMU on Apple Silicon a spike measured
# traversals 25-140x slower than native and produced a false NO-GO. An image
# that is fast on the reviewer's laptop has to be built for their laptop.
name: postgres image

on:
  push:
    branches: [main]
    paths:
      - docker/postgres.Dockerfile
      - .github/workflows/postgres-image.yml
  workflow_dispatch:

# Least privilege by default. Scorecard's Token-Permissions check reads the
# TOP level: without one, every job gets whatever the repository default is,
# which for a workflow that only reads code is more than it needs. A job that
# genuinely needs to write declares it for itself, below.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/postgres.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Pinned by the AGE release the Dockerfile clones, so a published
          # tag always says which AGE it contains.
          tags: |
            ghcr.io/ayushcodes10/echo-mem-postgres:pg16-age1.5.0
            ghcr.io/ayushcodes10/echo-mem-postgres:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
