# Every commit in a pull request must carry a Signed-off-by trailer.
#
# This replaced a Contributor License Agreement on 2026-10-26. The CLA's one
# addition over Apache 2.0 was the right to relicense a contribution later,
# and the project does not use it: everything commercial lives in a separate
# private repository. Asking people to agree to a right nobody exercises is
# friction bought with nothing.
#
# Written out rather than using a third-party app, so that what gates a pull
# request is readable in the repository that gates it.
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  signed-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit in the pull request, not just the tip. A branch where
          # only the last commit is signed off is the common near miss.
          fetch-depth: 0

      - name: Every commit needs a sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Bots do not sign off and cannot be asked to. Dependabot raises
          # most pull requests here and blocking it would make this check
          # something people route around rather than something they trust.
          AUTHOR='${{ github.event.pull_request.user.login }}'
          case "$AUTHOR" in
            dependabot\[bot\]|github-actions\[bot\]|*\[bot\])
              echo "$AUTHOR is a bot; sign-off not required"
              exit 0 ;;
          esac

          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            subject=$(git log -1 --format=%s "$sha")
            # The trailer must name the commit's own author. A sign-off
            # copied from somebody else certifies nothing.
            author=$(git log -1 --format='%an <%ae>' "$sha")
            if git log -1 --format=%B "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "  ok       ${sha:0:8}  $subject"
            else
              echo "  MISSING  ${sha:0:8}  $subject"
              missing=$((missing + 1))
            fi
          done < <(git rev-list "$BASE".."$HEAD")

          if [ "$missing" -gt 0 ]; then
            cat >&2 <<'EOF'

          Some commits have no Signed-off-by trailer naming their author.

          This project uses the Developer Certificate of Origin instead of a
          contributor agreement. There is nothing to read and agree to and no
          bot to reply to: you add one line per commit.

            most recent commit only
              git commit --amend -s --no-edit && git push --force-with-lease

            a branch with several
              git rebase --signoff main && git push --force-with-lease

            from now on
              git commit -s

          The full text is in DCO.md.
          EOF
            exit 1
          fi

          echo "every commit is signed off"
