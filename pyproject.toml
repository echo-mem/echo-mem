[project]
# The distribution is "echo-mem", not "echo-memory": that name is already taken
# on PyPI by an unrelated hosted product in this same category (Textstone Labs,
# published 2026-03-29), so `pip install echo-memory` installs theirs. The
# import package stays `echo_memory` - the CLI, the MCP registration command
# (`-m echo_memory.server`) and every existing install reference it, and
# renaming the module would break live configuration to fix a cosmetic mismatch.
name = "echo-mem"
version = "0.5.2"
description = "A long-horizon memory architecture for AI agents"
readme = "README.md"
# BUSL-1.1 is the SPDX identifier for the Business Source License 1.1, so
# the metadata can state it rather than inline the whole licence text.
# license-files ships both: LICENSE is what this version is under, and
# LICENSE-APACHE-2.0 is what everything up to 0.4.1 went out under and stays
# under. Saying "Apache-2.0" here would be a false statement in package
# metadata that pip, PyPI and every licence scanner would read as fact.
license = "BUSL-1.1"
license-files = ["LICENSE", "LICENSE-APACHE-2.0"]
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pgvector>=0.3,<1",
    "alembic>=1.13,<2",
    "sqlalchemy>=2,<3",
    "mcp>=2.0,<3",
    "sentence-transformers>=3,<4",
]

[project.scripts]
echo-memory = "echo_memory.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "build>=1,<2",
    "twine>=5,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"echo_memory.skill" = ["SKILL.md"]

[tool.pytest.ini_options]
markers = [
    "eval: retrieval-quality evals against real data (reserved, not in use yet)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
