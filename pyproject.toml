[project]
# The distribution is "echo-mem", not "echo-memory": that name is already taken
# on PyPI by an unrelated hosted product in this same category (Textstone Labs,
# published 2026-03-29), so `pip install echo-memory` installs theirs. The
# import package stays `echo_memory` - the CLI, the MCP registration command
# (`-m echo_memory.server`) and every existing install reference it, and
# renaming the module would break live configuration to fix a cosmetic mismatch.
name = "echo-mem"
version = "0.6.0"
description = "A long-horizon memory architecture for AI agents"
readme = "README.md"
# An SPDX expression, not an inlined licence text: pip, PyPI and every
# scanner read this field as the fact of the matter, so it has to agree with
# LICENSE. It said Apache-2.0 for a while after the project moved to BSL,
# which was a false statement to exactly the people who check metadata
# instead of reading a file. tests/unit/test_licence_claims.py pins it.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pgvector>=0.3,<1",
    "alembic>=1.13,<2",
    "sqlalchemy>=2,<3",
    "mcp>=2.0,<3",
    "sentence-transformers>=3,<7",
]

[project.scripts]
echo-memory = "echo_memory.cli.main:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<3",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
    "build>=1,<2",
    "twine>=5,<8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"echo_memory.skill" = ["SKILL.md"]

[tool.pytest.ini_options]
markers = [
    "eval: retrieval-quality evals against real data (reserved, not in use yet)",
]
testpaths = ["tests"]

[tool.coverage.run]
# Measured against the installed package rather than the source tree, because
# that is what the tests import and what a user runs. `branch` is on: a suite
# that executes every line and only ever takes one side of each `if` reports
# 100% while half the decisions are unexercised, and the decisions are where
# the bugs in this codebase have been.
source = ["echo_memory"]
branch = true

[tool.coverage.report]
# Deliberately NOT omitting the competitor adapters, which sit at 0%. They
# cannot be exercised without their SDKs, which are not in this project's
# requirements because they pull mutually incompatible dependency trees - so
# omitting them would raise the headline number by hiding exactly the code
# BENCHMARKS.md already describes as unverified. A number that excludes what
# is untested is not a coverage number.
exclude_also = [
    # A line that only runs under a type checker never runs under a test.
    "if TYPE_CHECKING:",
    # Re-raising after logging, where the test asserts on the raise.
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["src/echo_memory"]

# The SDKs for the competitor backends, psycopg's AGE extras and a few others
# ship no stubs and several are not installed here at all. Without this every
# import of them is an error, which buries the findings that are about this
# codebase.
ignore_missing_imports = true

# Off deliberately, all three. Turning them on today would add roughly 400
# errors about missing annotations on functions written before there was a
# checker, and a gate nobody can pass is a gate somebody deletes. The point
# of adding this now is that NEW code is checked; the back catalogue is a
# ratchet, below.
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

# An ignore comment that has stopped being necessary is a lie about the code
# that a reader will believe.
warn_unused_ignores = true
warn_redundant_casts = true

# Modules that do not type check yet. 61 errors across these 13 when this
# landed, down from 85 across 18 before the fixes in the same change.
#
# THIS LIST ONLY SHRINKS. Anything not named here is checked, so a new module
# is checked from its first line and cannot be added to the back catalogue by
# accident. Removing a name means fixing that module, which is the whole
# mechanism: the gate is useful immediately and gets stricter as the list
# empties.
#
# `server.py` and `retrieval/query_memory.py` are the two worth doing first.
# They hold 21 of the 61 and they are the code every read goes through.
[[tool.mypy.overrides]]
module = [
    "echo_memory.cli.adopt",
    "echo_memory.cli.infer_causal",
    "echo_memory.cli.judge",
    "echo_memory.cli.llm",
    "echo_memory.cli.main",
    "echo_memory.cli.stop_gate",
    "echo_memory.eval.backends.zep",
    "echo_memory.graph.communities",
    "echo_memory.ingestion.write_episode",
    "echo_memory.retrieval.query_memory",
    "echo_memory.server",
    "echo_memory.trial.check",
    "echo_memory.trial.observations",
]
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py311"
