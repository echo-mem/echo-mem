services:
  db:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    # Comes back on its own after a reboot, a Docker restart, or a crash.
    #
    # Without this the container stays down until someone runs `docker compose
    # up` by hand, and nothing tells them to. On 2026-09-09 the Docker VM was
    # not running after a restart, so every MCP tool call across every client
    # answered "couldn't get a connection after 5.00 sec" - agents kept asking
    # for memory and kept being told the store was unreachable, with the store
    # itself perfectly intact.
    #
    # `unless-stopped` rather than `always`: if you deliberately stop the
    # database, it stays stopped. Restarting Docker should not undo a decision
    # you made on purpose.
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-echo_memory}
    ports:
      # 5433, not 5432: avoids colliding with a locally-running Postgres.
      # 127.0.0.1, not a bare port: "5433:5432" binds 0.0.0.0 and [::], which
      # put this database on the network for anyone who could reach the
      # machine, with the password below. This one holds a real store.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Separate from `db`: the test suite's migrated_db fixture runs `alembic
  # upgrade head` / `downgrade base` around every test. If that pointed at
  # the same database as a real, running MCP server registration, a test
  # run and real agent usage racing each other would leave the real
  # server's schema at base mid-run. Opt-in via `--profile test` so it
  # doesn't start for anyone who isn't running tests.
  db-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-echo_memory}
    ports:
      # Loopback for the same reason as the database above. A test database is
      # no less reachable for being disposable, and it shares the machine.
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  postgres-test-data:
